name: Deploy Landingpage to GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - "udemy/Landingpage/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/css _site/fonts _site/img
          cp udemy/Landingpage/css/landing.css _site/css/
          cp udemy/Landingpage/fonts/game-of-thrones.ttf _site/fonts/
          cp -R udemy/Landingpage/img/. _site/img/
          cp udemy/Landingpage/html/landingpage.html _site/index.html
          sed -i 's#\.\./css/#css/#g; s#\.\./img/#img/#g' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
