<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ONG Esperança</title>
    <link rel="stylesheet" href="../css/ONG.css">
</head>
<body>
    <nav class="menu">
        <details class="menu-toggle" open>
            <summary aria-label="Abrir menu de navegação"><span></span><span></span><span></span></summary>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li class="submenu">
                    <details>
                        <summary>Participar</summary>
                        <ul>
                            <li><a href="cadastro.html">Cadastro de voluntários</a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </details>
    </nav>

    <main class="container">
        <section class="form-section">
            <h1>Cadastro de Voluntários</h1>
            <div class="feedback feedback--error" role="alert" aria-live="assertive" data-form-alert hidden></div>
            <form class="formulario">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                </fieldset>

                <button type="submit" class="btn">Enviar cadastro</button>
            </form>
            <div class="toast" role="status" aria-live="polite" data-toast>
                Cadastro enviado com sucesso.
            </div>
        </section>

    </main>
    <main id="app"></main>

    <footer>
        <p>ONG Esperança</p>
    </footer>
    <script src="../js/boas.js"></script>
</body>
</html>
